<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img"><title>Block diagram of the heart rate monitor</title>
<defs><marker id="hr-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="bd-arrow" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bd-box" x="460" y="20" width="130" height="52" rx="6"/>
<text class="bd-text" x="525" y="51" text-anchor="middle">PP3 9 V battery</text>
<rect class="bd-box" x="620" y="20" width="120" height="52" rx="6"/>
<text class="bd-text" x="680" y="42" text-anchor="middle">LM2937</text>
<text class="bd-small" x="680" y="60" text-anchor="middle">9 V to 5 V</text>
<path class="bd-line" d="M590,46 H616" marker-end="url(#hr-arr)"/>
<path class="bd-line" d="M680,72 V106" marker-end="url(#hr-arr)"/>
<text class="bd-small" x="688" y="94">5 V</text>
<rect class="bd-box" x="20" y="118" width="150" height="74" rx="6"/>
<text class="bd-text" x="95" y="148" text-anchor="middle">Finger clip</text>
<text class="bd-small" x="95" y="166" text-anchor="middle">IR LED and</text>
<text class="bd-small" x="95" y="182" text-anchor="middle">phototransistor</text>
<path class="bd-line" d="M170,155 H216" marker-end="url(#hr-arr)"/>
<text class="bd-small" x="180" y="146">PPG</text>
<rect class="bd-box" x="220" y="110" width="200" height="90" rx="6"/>
<text class="bd-text" x="320" y="140" text-anchor="middle">Band-pass amplifier</text>
<text class="bd-small" x="320" y="160" text-anchor="middle">two MCP6292 stages</text>
<text class="bd-small" x="320" y="178" text-anchor="middle">3.3 V rail, 1.65 V reference</text>
<path class="bd-line" d="M420,155 H466" marker-end="url(#hr-arr)"/>
<text class="bd-small" x="426" y="146">pulse</text>
<rect class="bd-chip" x="470" y="110" width="270" height="90" rx="6"/>
<text class="bd-text" x="605" y="140" text-anchor="middle">LPC1768 (mbed)</text>
<text class="bd-small" x="605" y="160" text-anchor="middle">samples, smooths and finds each beat</text>
<text class="bd-small" x="605" y="178" text-anchor="middle">BPM from the time between beats</text>
<path class="bd-line" d="M605,200 V240"/>
<path class="bd-line" d="M115,240 H630"/>
<path class="bd-line" d="M115,240 V276" marker-end="url(#hr-arr)"/>
<path class="bd-line" d="M365,240 V276" marker-end="url(#hr-arr)"/>
<path class="bd-line" d="M630,240 V276" marker-end="url(#hr-arr)"/>
<text class="bd-small" x="376" y="264">SPI, through 74HCT04 buffers to 5 V</text>
<rect class="bd-box" x="20" y="280" width="190" height="66" rx="6"/>
<text class="bd-text" x="115" y="308" text-anchor="middle">Text LCD</text>
<text class="bd-small" x="115" y="328" text-anchor="middle">beats per minute</text>
<rect class="bd-box" x="250" y="280" width="230" height="66" rx="6"/>
<text class="bd-text" x="365" y="308" text-anchor="middle">MAX7221 and 8×8 LEDs</text>
<text class="bd-small" x="365" y="328" text-anchor="middle">beating heart or pulse trace</text>
<rect class="bd-box" x="520" y="280" width="220" height="66" rx="6"/>
<text class="bd-text" x="630" y="308" text-anchor="middle">RGB LED</text>
<text class="bd-small" x="630" y="328" text-anchor="middle">flashes with each beat</text>
</svg>
