<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img"><title>Block diagram of the line-following robot electronics</title>
<defs><marker id="rb-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="bd-arrow" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bd-box" x="20" y="24" width="150" height="56" rx="6"/>
<text class="bd-text" x="95" y="57" text-anchor="middle">12 V battery</text>
<rect class="bd-box" x="250" y="24" width="250" height="56" rx="6"/>
<text class="bd-text" x="375" y="50" text-anchor="middle">Power board</text>
<text class="bd-small" x="375" y="68" text-anchor="middle">12 V, 5 V (7805), 3.3 V (LD1117)</text>
<path class="bd-line" d="M170,52 H246" marker-end="url(#rb-arr)"/>
<rect class="bd-box" x="20" y="150" width="150" height="70" rx="6"/>
<text class="bd-text" x="95" y="180" text-anchor="middle">Laptop</text>
<text class="bd-small" x="95" y="200" text-anchor="middle">build, flash, monitor</text>
<rect class="bd-chip" x="250" y="130" width="250" height="110" rx="6"/>
<text class="bd-text" x="375" y="170" text-anchor="middle">FRDM-KL25Z</text>
<text class="bd-small" x="375" y="190" text-anchor="middle">NXP KL25Z, Arm Cortex-M0+, 48 MHz</text>
<text class="bd-small" x="375" y="208" text-anchor="middle">register-level C firmware</text>
<path class="bd-line" d="M170,185 H246" marker-start="url(#rb-arr)" marker-end="url(#rb-arr)"/>
<text class="bd-small" x="178" y="176">USB, UART</text>
<path class="bd-line" d="M330,80 V126" marker-end="url(#rb-arr)"/>
<text class="bd-small" x="338" y="108">3.3 V, 5 V</text>
<rect class="bd-box" x="580" y="130" width="160" height="70" rx="6"/>
<text class="bd-text" x="660" y="160" text-anchor="middle">L298 H-bridge</text>
<text class="bd-small" x="660" y="180" text-anchor="middle">motor driver board</text>
<path class="bd-line" d="M500,165 H576" marker-end="url(#rb-arr)"/>
<text class="bd-small" x="508" y="156">10 kHz PWM,</text>
<text class="bd-small" x="508" y="186">direction</text>
<path class="bd-line" d="M440,80 V100 H660 V126" marker-end="url(#rb-arr)"/>
<text class="bd-small" x="560" y="94">12 V</text>
<rect class="bd-box" x="580" y="250" width="160" height="56" rx="6"/>
<text class="bd-text" x="660" y="283" text-anchor="middle">Two gearmotors</text>
<path class="bd-line" d="M660,200 V246" marker-end="url(#rb-arr)"/>
<rect class="bd-box" x="250" y="270" width="250" height="50" rx="6"/>
<text class="bd-text" x="375" y="300" text-anchor="middle">Line and obstacle sensors</text>
<path class="bd-line" d="M375,270 V244" marker-end="url(#rb-arr)"/>
<text class="bd-small" x="383" y="262">analogue inputs</text>
</svg>
